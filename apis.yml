name: Yo Fio
description: YoFio is a Mexican fintech founded in 2019 that provides working-capital
  credit to micro and small businesses, particularly neighborhood corner stores (tienditas).
  Through a mobile app and web platform it offers revolving credit lines of 7,000 to
  200,000 Mexican pesos with up to 14 days of interest-free financing so merchants can
  restock inventory and pay suppliers. YoFio uses AI-powered machine-vision technology
  to assess creditworthiness from photos and videos of a store and its inventory, cutting
  the evaluation process to roughly 15 minutes. It is backed by 500 Global and Oikocredit,
  and serves thousands of businesses across the Valley of Mexico, Puebla, and Guadalajara.
  YoFio publishes no public API or developer platform; this profile captures its identity
  and public web surface.
